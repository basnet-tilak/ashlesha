spring:
  application:
    name: kuberwallet-users
  datasource:
    url: jdbc:h2:mem:kuberwallet;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: password
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
  jackson:
    serialization:
      WRITE_DATES_AS_TIMESTAMPS: false

logging:
  level:
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG

security:
  jwt:
    secret: ${JWT_SECRET:change-me-to-a-very-long-secret-key}
    issuer: kuberwallet-identity
    access-token-ttl: PT1H

management:
  endpoints:
    web:
      exposure:
        include: health, info
